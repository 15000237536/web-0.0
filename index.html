<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>聊天记录</title>
</head>
<body>
    <h1>聊天记录</h1>
    <input type="file" id="files" accept=".txt" multiple>
    <div id="list"></div>
    <hr>
    <h2 id="title"></h2>
    <div id="content" style="white-space: pre-wrap; overflow-wrap: anywhere;"></div>

    <script>
        const files = document.getElementById("files");
        const list = document.getElementById("list");
        const title = document.getElementById("title");
        const content = document.getElementById("content");

        const categories = {
            "聊天记录 2.txt": "就业与考录",
            "聊天记录 3.txt": "课程学习",
            "聊天记录 4.txt": "实践教学",
            "聊天记录 5.txt": "志愿者活动",
            "聊天记录 9.txt": "志愿者活动",
            "聊天记录 10.txt": "志愿者活动"
        };

        files.onchange = function () {
            list.replaceChildren();
            title.textContent = "";
            content.replaceChildren();

            const groups = {};

            for (const file of files.files) {
                const category = categories[file.name] || "其他文件";

                if (!groups[category]) {
                    const heading = document.createElement("h2");
                    heading.textContent = category;
                    list.appendChild(heading);

                    groups[category] = document.createElement("ul");
                    list.appendChild(groups[category]);
                }

                const item = document.createElement("li");
                const button = document.createElement("button");
                button.textContent = file.name;
                button.onclick = () => showFile(file);
                item.appendChild(button);
                groups[category].appendChild(item);
            }
        };

        async function showFile(file) {
            const text = await file.text();
            title.textContent = file.name;
            content.replaceChildren();

            const parts = text.split(/(https?:\/\/[^\s<>"“”]+)/g);

            for (const part of parts) {
                if (/^https?:\/\//.test(part)) {
                    const link = document.createElement("a");
                    link.href = part;
                    link.textContent = part;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    content.appendChild(link);
                } else {
                    content.appendChild(document.createTextNode(part));
                }
            }
        }
    </script>
</body>
</html>
